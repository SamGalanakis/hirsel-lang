# libmimalloc-sys 0.1.49 build.rs without features on Linux: mimalloc v3's
# single-translation-unit static.c, release flags, initial-exec TLS. Transparent
# huge pages are off by default (MI_DEFAULT_ALLOW_THP=0): with the kernel's
# madvise defrag, faulting mimalloc's arenas in ran direct compaction, which
# doubled a hello-world check's wall time. MIMALLOC_ALLOW_THP=1 re-enables them.
# Arenas commit on demand (MI_DEFAULT_ARENA_EAGER_COMMIT=0): an eagerly committed
# arena is a writable mapping that hirsel-guard's RLIMIT_DATA counts in full
# before any of it is used.
buildscript.run = false

[[cxx_library]]
name = "mimalloc"
srcs = ["c_src/mimalloc/v3/src/static.c"]
headers = ["c_src/mimalloc/v3/include/**/*.h", "c_src/mimalloc/v3/src/**/*.c", "c_src/mimalloc/v3/src/**/*.h"]
include_paths = ["c_src/mimalloc/v3/include", "c_src/mimalloc/v3/src"]
compiler_flags = ["-O3", "-DMI_DEBUG=0", "-DMI_BUILD_RELEASE", "-DNDEBUG", "-DMI_DEFAULT_ALLOW_THP=0", "-DMI_DEFAULT_ARENA_EAGER_COMMIT=0", "-ftls-model=initial-exec", "-Wno-error=date-time"]
