# Reindeer projects third-party/Cargo.toml (written by sync.py from the
# workspace resolution) into third-party/BUCK. Crate sources are http_archive
# downloads pinned by Cargo.lock checksums; Buck2 never runs Cargo.
manifest_path = "Cargo.toml"
third_party_dir = "."
fixups_dir = "fixups"
vendor = false
precise_srcs = false
include_top_level = false
include_workspace_members = false
cargo_env = true

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
execution-platform = true

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"
execution-platform = false

[buck]
file_name = "BUCK"
platform_compatibility_on_all_targets = true
rust_library = "third_party_rust_library"
rust_binary = "third_party_rust_binary"
cxx_library = "third_party_cxx_library"
prebuilt_cxx_library = "third_party_prebuilt_cxx_library"
buildscript_genrule = "third_party_buildscript_run"
http_archive = "third_party_http_archive"
buckfile_imports = """
load(
    "@root//tools/buck2:third_party.bzl",
    "third_party_buildscript_run",
    "third_party_cxx_library",
    "third_party_http_archive",
    "third_party_prebuilt_cxx_library",
    "third_party_rust_binary",
    "third_party_rust_library",
)
"""
