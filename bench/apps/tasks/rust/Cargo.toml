[package]
name = "tasks-rust"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.52.0", features = ["rt", "rt-multi-thread", "net", "sync", "time", "signal", "io-std", "io-util", "macros"] }
datastar = { version = "=0.4.1", features = ["axum"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
serde_urlencoded = "=0.7.1"
async-stream = "=0.3.6"
chrono = { version = "=0.4.44", default-features = false, features = ["clock"] }

reqwest = { version = "=0.12.24", default-features = false, features = ["stream", "json"] }
futures-util = "=0.3.34"
bytes = "=1.11.1"
libc = "=0.2.191"
hdrhistogram = "=7.5.4"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
