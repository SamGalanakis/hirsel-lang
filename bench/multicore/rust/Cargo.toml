[package]
name = "multicore-tokio"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tokio = { version = "=1.52.0", features = ["rt-multi-thread", "sync", "macros"] }
futures-util = "=0.3.34"
serde_json = "=1.0.149"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
