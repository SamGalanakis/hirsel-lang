[package]
name = "hirsel-native-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace]

[dependencies]
bumpalo = { version = "=3.19.0", features = ["collections"] }
mimalloc = { version = "=0.1.39", optional = true, default-features = false }
libmimalloc-sys = { version = "=0.1.35", optional = true, default-features = false }

[features]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
stats = []

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
overflow-checks = true
panic = "abort"
