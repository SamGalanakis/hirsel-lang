// The greeter service of the gRPC examples (grpc/grpc examples/protos/helloworld.proto,
// Apache-2.0), with a server-streaming method added.
syntax = "proto3";

package helloworld;

// The greeting service definition.
service Greeter {
  // Sends a greeting.
  rpc SayHello (HelloRequest) returns (HelloReply) {}
  // Sends `count` greetings, one per reply.
  rpc SayHelloStream (HelloRequest) returns (stream HelloReply) {}
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
  int32 count = 2;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}
