# The loom model of cross-worker storage return: it compiles crates/hirsel-rt/src/remote.rs from
# its own source against loom's atomics. A workspace member, so every main run builds
# and runs its models (crate tests); check.sh adds the bound sweeps and mutations.
[package]
name = "hirsel-heaps-loom"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# Mutations, each of which must fail: the owner's direct collection of its current page clears
# the queued flag (dequeue instead of take), and the trim releases an empty slab without the
# busy test.
direct-dequeue = []
blind-trim = []

[dependencies]
loom = "=0.7.2"

[dev-dependencies]
hirsel-guard = { path = "../../../crates/hirsel-guard" }
