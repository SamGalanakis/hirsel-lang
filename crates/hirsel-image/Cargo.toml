[package]
name = "hirsel-image"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hirsel-intern = { path = "../hirsel-intern" }
hirsel-span = { path = "../hirsel-span" }
hirsel-syntax = { path = "../hirsel-syntax" }
hirsel-types = { path = "../hirsel-types" }
bincode = "1.3.3"
libc = "0.2"
serde = "1"

[dev-dependencies]
hirsel-guard = { path = "../hirsel-guard" }
hirsel-intern = { path = "../hirsel-intern", features = ["id-salt"] }
hirsel-syntax = { path = "../hirsel-syntax", features = ["id-salt"] }
hirsel-types = { path = "../hirsel-types", features = ["testing"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
