[package]
name = "hirsel-run-config"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }
webpki = { package = "rustls-webpki", version = "=0.103.15", default-features = false, features = ["std"] }

[dev-dependencies]
hirsel-guard = { path = "../hirsel-guard" }
proptest = "1"
