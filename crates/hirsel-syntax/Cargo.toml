[package]
name = "hirsel-syntax"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
hirsel-span = { path = "../hirsel-span" }
hirsel-intern = { path = "../hirsel-intern" }
sha2 = "0.10"

[features]
# Seeded session id assignment (hirsel_intern's id-salt) for oracle O1.
id-salt = ["hirsel-intern/id-salt"]

[dev-dependencies]
hirsel-guard = { path = "../hirsel-guard" }
hirsel-syntax = { path = ".", features = ["id-salt"] }
