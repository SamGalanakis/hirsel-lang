[package]
name = "hirsel-conformance"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "hirsel-conformance"

[dependencies]
hirsel-diag = { path = "../hirsel-diag" }
hirsel-driver = { path = "../hirsel-driver" }
hirsel-engine = { path = "../hirsel-engine" }
serde_json = "1"
hirsel-span = { path = "../hirsel-span" }
hirsel-syntax = { path = "../hirsel-syntax" }

# Binaries without tests: no unit-test harness, which would relink the whole
# compiler on every edit. `native` keeps its tests.
[[bin]]
name = "hirsel-conformance"
path = "src/main.rs"
test = false

[[bin]]
name = "agree"
path = "src/bin/agree.rs"
test = false

[[bin]]
name = "corpus-fmt"
path = "src/bin/corpus-fmt.rs"
test = false

[[bin]]
name = "profile"
path = "src/bin/profile.rs"
test = false
