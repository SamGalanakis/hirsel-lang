[package]
name = "hirsel-validate"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sha2 = "0.10"
bincode = "1.3.3"
hirsel-artifact-store = { path = "../hirsel-artifact-store" }
hirsel-product-codec = { path = "../hirsel-product-codec" }
hirsel-span = { path = "../hirsel-span" }
serde = { version = "1", features = ["derive"] }
hirsel-type-analysis = { path = "../hirsel-type-analysis" }
hirsel-graph = { path = "../hirsel-graph" }
hirsel-intern = { path = "../hirsel-intern" }
hirsel-syntax = { path = "../hirsel-syntax" }
hirsel-tir = { path = "../hirsel-tir" }
hirsel-types = { path = "../hirsel-types" }

[dev-dependencies]
serde_json = "1"
# Seeded session id assignment for oracle O1.
hirsel-intern = { path = "../hirsel-intern", features = ["id-salt"] }
hirsel-guard = { path = "../hirsel-guard" }
hirsel-diag = { path = "../hirsel-diag" }
