[package]
name = "hirsel-rt"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
diagnostic = []
# Acceptance archives only; the default runtime keeps concurrent Free staged.
# Independent link-time choices; timing archives never enable measurement.
system-allocator = []
# Valgrind memcheck client requests for the memcheck campaign; no inline fast paths.
memcheck = []
# ThreadSanitizer fiber annotations, for builds with `-Zsanitizer=thread`.
tsan = ["hirsel-free/tsan"]
measurement = []
# Original-execution operation sidecars; absent from shipping archives.
operation-latency = []
# Explicit ownership diagnostics; no hooks or storage in ordinary archives.
ownership-trace = []

[dependencies]
base64-simd = "=0.8.0"
simdutf8 = "=0.1.5"
serde_json = "1"
hirsel-free = { path = "../hirsel-free" }
hirsel-kernels = { path = "../hirsel-kernels" }
hirsel-core-contract = { path = "../hirsel-core-contract" }
hirsel-rt-operations = { path = "../hirsel-rt-operations" }
hirsel-run-config = { path = "../hirsel-run-config" }
hirsel-run-schema = { path = "../hirsel-run-schema" }
libc = { version = "0.2", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
sha2 = "0.10"

[dev-dependencies]
base64 = "=0.22.1"
simdutf8 = { version = "=0.1.5", features = ["public_imp"] }
tempfile = "3"
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit", "clone-impls"] }
hirsel-guard = { path = "../hirsel-guard" }
hirsel-layout = { path = "../hirsel-layout" }
hirsel-rt = { path = ".", features = ["diagnostic"] }
hirsel-lir = { path = "../hirsel-lir" }
hirsel-syntax = { path = "../hirsel-syntax" }
hirsel-tir = { path = "../hirsel-tir" }
hirsel-types = { path = "../hirsel-types", features = ["testing"] }
