[package]
name = "hirsel-rt"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
diagnostic = []
# Independent link-time choices; timing archives never enable measurement.
system-allocator = []
# Valgrind memcheck client requests for the memcheck campaign; no inline fast paths.
memcheck = []
measurement = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }
hirsel-free = { path = "../hirsel-free" }
hirsel-kernels = { path = "../hirsel-kernels" }
hirsel-core-contract = { path = "../hirsel-core-contract" }
hirsel-run-config = { path = "../hirsel-run-config" }
hirsel-run-schema = { path = "../hirsel-run-schema" }
libc = { version = "0.2", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
sha2 = "0.10"

[dev-dependencies]
hirsel-rt-operations = { path = "../hirsel-rt-operations" }
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit", "clone-impls"] }
hirsel-guard = { path = "../hirsel-guard" }
hirsel-layout = { path = "../hirsel-layout" }
hirsel-rt = { path = ".", features = ["diagnostic"] }
hirsel-lir = { path = "../hirsel-lir" }
hirsel-syntax = { path = "../hirsel-syntax" }
hirsel-tir = { path = "../hirsel-tir" }
hirsel-types = { path = "../hirsel-types", features = ["testing"] }
