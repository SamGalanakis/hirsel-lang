[package]
name = "hirsel-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hirsel"
path = "src/main.rs"
test = false

[dependencies]
hirsel-guard = { path = "../hirsel-guard" }
hirsel-cli-args = { path = "../hirsel-cli-args" }
hirsel-diag = { path = "../hirsel-diag" }
hirsel-driver = { path = "../hirsel-driver" }
hirsel-engine = { path = "../hirsel-engine" }
hirsel-intern = { path = "../hirsel-intern" }
hirsel-run-schema = { path = "../hirsel-run-schema" }

mimalloc = { version = "=0.1.52", default-features = false }
serde_json = "1"

[dev-dependencies]
hirsel-rt = { path = "../hirsel-rt" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
