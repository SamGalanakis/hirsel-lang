[package]
name = "hirsel-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
native-tsan = ["hirsel-driver/native-tsan"]

[[bin]]
name = "hirsel"
path = "src/main.rs"
test = true

[dependencies]
hirsel-guard = { path = "../hirsel-guard" }
hirsel-cli-args = { path = "../hirsel-cli-args" }
hirsel-diag = { path = "../hirsel-diag" }
hirsel-driver = { path = "../hirsel-driver" }
hirsel-engine = { path = "../hirsel-engine" }
hirsel-intern = { path = "../hirsel-intern" }
hirsel-run-config = { path = "../hirsel-run-config" }
hirsel-run-schema = { path = "../hirsel-run-schema" }

libc = { version = "0.2", default-features = false }
mimalloc = { version = "=0.1.52", default-features = false }
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
hirsel-interp = { path = "../hirsel-interp" }
tempfile = "3"
hirsel-free = { path = "../hirsel-free" }
hirsel-rt = { path = "../hirsel-rt" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
